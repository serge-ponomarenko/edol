name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Validate version and release notes
        env:
          RELEASE_REF: ${{ gitea.ref }}
        run: python3 .gitea/scripts/release.py check
      - name: Deployment and realm checks
        run: |
          python3 -B -m unittest discover -s docker/deploy/tests
          python3 -B -m unittest discover -s .gitea/scripts/tests
          node docker/keycloak/realm/validate-realm-schema.mjs
          bash -n docker/deploy/dispatch.sh
      - name: Require Docker for migration and RLS tests
        run: docker info > /dev/null
      - name: Build and test complete reactor
        run: mvn -B clean verify
      - name: SonarQube analysis and required Quality Gate
        id: sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_IP }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" && test -n "$SONAR_TOKEN"
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=org.spon:edol \
            -Dsonar.scanner.metadataFilePath="$PWD/target/sonar/report-task.txt" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
      - name: Publish Sonar Results summary and PR comment
        if: always() && steps.sonar.outcome != 'skipped'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_IP }}
          SONAR_PUBLIC_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITEA_TOKEN: ${{ secrets.GITEACI_TOKEN }}
        run: python3 .gitea/scripts/sonar_report.py

  prod-deploy:
    needs: build
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Deploy verified main revision and preserve production data
        env:
          EDOL_PROD_SSH_HOST: ${{ secrets.EDOL_PROD_SSH_HOST }}
          EDOL_PROD_SSH_USER: ${{ secrets.EDOL_PROD_SSH_USER }}
          EDOL_PROD_SSH_PORT: ${{ secrets.EDOL_PROD_SSH_PORT }}
          EDOL_PROD_SSH_KEY: ${{ secrets.EDOL_PROD_SSH_KEY }}
          EDOL_PROD_SSH_KNOWN_HOSTS: ${{ secrets.EDOL_PROD_SSH_KNOWN_HOSTS }}
          EDOL_SOURCE_SHA: ${{ gitea.sha }}
        run: bash docker/deploy/dispatch.sh secure prod

  release:
    needs: build
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ gitea.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish versioned images and release
        env:
          RELEASE_REF: ${{ gitea.ref }}
          RELEASE_SERVER: ${{ gitea.server_url }}
          RELEASE_REPOSITORY: ${{ gitea.repository }}
          REGISTRY_USER: ${{ secrets.EDOL_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.EDOL_REGISTRY_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.EDOL_RELEASE_TOKEN }}
        run: python3 .gitea/scripts/release.py release-main
