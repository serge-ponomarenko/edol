server:
  port: ${SERVER_PORT}

logging:
  file.name: ./logs/edol_core_application.log

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas:
      - core
    default-schema: core
    create-schemas: true

app:
  zone-id: Europe/Kiev

mqttServer:
  url: tcp://mqtt:1883

bot:
  webAdminName: ${WEB_ADMIN_NAME}
  webAdminPassword: ${WEB_ADMIN_PASSWORD}

bambu:
  client-id: edol-core
  connection-timeout: 5  # seconds
  show-raw-mqtt: ${BAMBU_SHOW_RAW_MQTT:false}

camera:
  snapshot-dir: ./camera_snapshots
  store-snapshots: ${STORE_CAMERA_SNAPSHOTS:true}


