spring:
  datasource:
    url: ${EDOL_HUB_STAGE5_SMOKE_DB_JDBC_URL}
    username: ${EDOL_HUB_STAGE5_SMOKE_RUNTIME_DB_USER}
    password: ${EDOL_HUB_STAGE5_SMOKE_RUNTIME_DB_PASSWORD}
  flyway:
    clean-disabled: true
    user: ${EDOL_HUB_STAGE5_SMOKE_FLYWAY_DB_USER}
    password: ${EDOL_HUB_STAGE5_SMOKE_FLYWAY_DB_PASSWORD}

logging:
  file:
    name: ${java.io.tmpdir}/edol-stage5-smoke-hub.log

edol-core:
  url: ${EDOL_CORE_STAGE5_SMOKE_URL}

edol-hub:
  qr-url: http://127.0.0.1:1/qr
  registration:
    self-service-enabled: true
  session:
    maximum-age: PT60S

mqttServer:
  url: tcp://127.0.0.1:1
