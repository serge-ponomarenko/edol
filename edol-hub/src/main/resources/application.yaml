server:
  port: 8090

logging:
  file.name: ./logs/edol_hub_application.log

edol-core:
  url: http://edolcore:8080

edol-hub:
  qr-url: ${QR_URL}

mqttServer:
  url: tcp://mqtt:1883

spring:

  data:
    jpa:
      repositories:
        bootstrap-mode: lazy

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${HUB_RUNTIME_DB_USER}
    password: ${HUB_RUNTIME_DB_PASSWORD}

  flyway:
    enabled: true
    schemas:
      - hub
    default-schema: hub
    create-schemas: true
    user: ${HUB_FLYWAY_DB_USER}
    password: ${HUB_FLYWAY_DB_PASSWORD}
    init-sqls:
      - SET ROLE hub_schema_owner

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hub

  thymeleaf:
    cache: false
