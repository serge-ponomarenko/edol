server:
  port: 8090

logging:
  file.name: ./logs/edol_hub_application.log

edol-core:
  url: http://edolcore:8080

edol-hub:
  qr-url: ${QR_URL}

mqttServer:
  url: tcp://mqtt:1883

spring:

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    schemas:
      - hub
    default-schema: hub
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hub

  thymeleaf:
    cache: false