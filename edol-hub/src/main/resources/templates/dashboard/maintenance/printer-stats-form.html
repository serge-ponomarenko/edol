<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Printer Statistics • Edol Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.52.0/dist/tabler-icons.min.css" rel="stylesheet" integrity="sha384-mwnzcqY8cv5426J0tglf5b/kfJNlRoajDjr7SIH7okVM3zG61jPtbbVZTegGc8vl" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link href="/favicon.svg" rel="icon" type="image/svg+xml">

</head>

<body class="layout-fluid">

<div class="page">

    <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark bg-dark"
           th:fragment="sidebar">
        <div th:replace="~{dashboard/sidebar :: sidebar}"></div>
    </aside>

    <div class="page-wrapper">
        <div class="page-body">
            <div class="container-xl mt-4">
                <div th:replace="~{dashboard/printers/settings-nav :: settingsNav(${printerId}, ${selectedPrinter != null ? selectedPrinter.name : 'Printer'}, 'maintenance')}"></div>

                <div class="card">

                    <div class="card-header">
                        <h3 class="card-title">Printer statistics</h3>
                    </div>

                    <div class="card-body">

                        <form data-settings-form method="post" th:action="@{/printers/{id}/maintenance/config/printer-stats-form(id=${printerId})}"
                              th:object="${stats}">

                            <input th:field="*{id}" type="hidden">

                            <div class="mb-3">
                                <label class="form-label" for="printerStartedPrintingDate">
                                    Printer Start Printing Date
                                </label>

                                <input id="printerStartedPrintingDate" class="form-control"
                                       th:field="*{printerStartedPrintingDate}"
                                       type="datetime-local">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="totalPrintHours">
                                    Total Print Time (hours)
                                </label>

                                <input id="totalPrintHours" class="form-control"
                                       min="0"
                                       step="1"
                                       th:field="*{totalPrintHours}"
                                       type="number">
                            </div>

                            <div class="mb-3">

                                <label class="form-label" for="totalJobs">
                                    Total Jobs
                                </label>

                                <input id="totalJobs" class="form-control"
                                       th:field="*{totalJobs}"
                                       type="number">

                            </div>

                            <div class="mb-3">

                                <label class="form-label" for="totalFilamentUsedGrams">
                                    Total Filament Used (grams)
                                </label>

                                <input id="totalFilamentUsedGrams" class="form-control"
                                       th:field="*{totalFilamentUsedGrams}"
                                       type="number">

                            </div>

                            <button class="btn btn-primary">
                                Save
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<script src="/js/settings-forms.js" defer></script>
</body>
</html>
