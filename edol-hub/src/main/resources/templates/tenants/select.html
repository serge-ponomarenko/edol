<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select tenant</title>
</head>
<body>
<main>
    <h1>Select tenant</h1>
    <p th:if="${#lists.isEmpty(memberships)}">No active EDOL tenant membership is available.</p>
    <form th:each="membership : ${memberships}" th:action="@{/tenants/select}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="tenantId" th:value="${membership.tenant.id}">
        <button type="submit" th:text="${membership.tenant.name}">Tenant</button>
    </form>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Sign out</button>
    </form>
</main>
</body>
</html>
